<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function () {
        try {
          var _fetch = window.fetch;
          Object.defineProperty(window, 'fetch', {
            configurable: true,
            enumerable: true,
            get: function () {
              return _fetch;
            },
            set: function (newFetch) {
              _fetch = newFetch;
            },
          });
        } catch (e) {}

        window.addEventListener(
          'error',
          function (e) {
            if (
              (e.filename && e.filename.indexOf('chrome-extension://') !== -1) ||
              (e.message &&
                (e.message.indexOf('has only a getter') !== -1 ||
                  e.message.indexOf('Cannot set property fetch') !== -1))
            ) {
              e.preventDefault();
              e.stopImmediatePropagation();
              return true;
            }
          },
          true
        );
      })();
    </script>
